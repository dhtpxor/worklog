<title>오토리몰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 무신사식 상점 골격 — 상시 검색바 + 카테고리 칩, 폰은 하단 탭바(홈·카테고리·검색·좋아요·마이),
   상품 페이지는 사진|구매정보 2단 + 스티키 섹션 탭(상품정보·실측·후기·문의·배송반품), 폰은 하단 고정 구매바와 옵션 바텀시트.
   색은 오토리몰 고유 팔레트(종이·돌색·먹색·슬레이트) 하나로 고정된 라이트 디자인. 할인율·주의만 유채색. */
:root{
  --bg:#F7F7F5; --surface:#ECEDEA; --raised:#FFFFFF; --line:#D6D8D4; --line-input:#7C8288;
  --text:#1C1F22; --muted:#5E656B; --accent:#4A5868; --on-accent:#FFFFFF; --ink:#1C1F22; --on-ink:#FFFFFF;
  --danger:#B9321F; --success:#2F6B4F; --warning:#8A5A00;
  --font:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hdr:56px; --tabbar:56px; --buybar:72px; --maxw:1180px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
FONTS_PLACEHOLDER
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}

button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* 미리보기 띠 */
.demo{background:var(--ink);color:#C9CDD1;font-size:12.5px;text-align:center;padding:7px 16px}

/* 헤더 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(247,247,245,.96);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{height:var(--hdr);display:flex;align-items:center;gap:16px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo svg{width:34px;height:34px;flex-shrink:0}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1.5px solid var(--ink);background:var(--raised);color:var(--muted);font-size:14px;text-align:left}
.search .ico{width:18px;height:18px}
.spacer{flex:1}
.hbtn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:0 10px;height:38px;position:relative}
.hbtn .count{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.hbtn .count:empty,.hbtn .count[data-zero]{display:none}
@media (max-width:860px){.search{display:none}.hbtn.likes{display:none}.hbtn span.lbl{display:none}}

/* 카테고리 칩 줄 */
.catrow{border-bottom:1px solid var(--line);background:var(--bg)}
.catrow .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.catrow .wrap::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13.5px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.55;cursor:default}

/* 홈 */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:28px 26px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.tori-hero{width:clamp(84px,12vw,124px);height:auto;aspect-ratio:1}
.hero h1{font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1;margin:8px 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);font-size:15px}
.hero .meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.85}
.hero .meta b{color:var(--text);font-weight:600}
@media (max-width:720px){.hero .wrap{grid-template-columns:auto minmax(0,1fr);padding-block:20px 18px;gap:14px}.hero .meta{grid-column:1/-1;text-align:left;display:flex;gap:14px;flex-wrap:wrap;line-height:1.5}}
.sec{padding-block:26px 6px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:18px;font-weight:600;margin:0}
.sec-head span,.sec-head button{font-size:13px;color:var(--muted)}

.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin}

.rail .card.rank{flex-basis:170px}
.rank .ph{position:relative}
.rank .badge{position:absolute;left:0;top:0;width:28px;height:28px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;z-index:1}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 14px}
.toolbar h2{font-size:18px;font-weight:600;margin:0}
.toolbar .cnt{font-size:13px;color:var(--muted);margin-left:8px}
.sort{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.sort select{height:34px;border:1px solid var(--line);background:var(--raised);padding:0 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 18px;padding-bottom:56px}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;position:relative}

.card:hover .ph img{transform:scale(1.03)}
.card .heart{position:absolute;right:6px;bottom:6px;width:36px;height:36px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.card .heart .ico{width:22px;height:22px}
.card .heart[aria-pressed=true]{color:var(--danger);filter:none}
.card .brand{font-size:12px;color:var(--muted);font-weight:500}
.card .nm{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .pr{font-size:16px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.card .pr .off{color:var(--danger)}
.card .pr s{color:var(--muted);font-weight:400;font-size:12.5px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.card .tags span{border:1px solid var(--line);padding:1px 6px}
.empty{padding:56px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:6px}
.empty .btn{margin:16px auto 0;max-width:220px}

/* 상품 페이지 */
.crumb{font-size:13px;color:var(--muted);padding-block:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--text)}
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;padding-bottom:40px}

.gallery .main{background:var(--surface);aspect-ratio:1/1;max-width:100%}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}

.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 16px);min-width:0}
@media (max-width:860px){.info{position:static}}
.info h1{font-size:clamp(20px,2.6vw,26px);font-weight:600;line-height:1.35;margin:6px 0 10px;letter-spacing:-.01em}
.social{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin-bottom:16px}

.price{font-size:28px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.coupon{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border:1px dashed var(--line-input);font-size:13px;color:var(--muted)}
.coupon .ico{width:16px;height:16px}
.rows{margin:20px 0 16px;border-top:1px solid var(--ink)}
.rows div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows dt{color:var(--muted)} .rows dd{margin:0}
.rows dd b{font-weight:600}
.rows dd .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.qty-line{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;background:var(--surface)}

.stepper button{width:36px;height:36px;font-size:18px} .stepper button:disabled{color:#B8BCBF;cursor:default}
.stepper output{min-width:40px;text-align:center;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0}
.total span{font-size:14px;color:var(--muted)} .total b{font-size:22px;font-weight:800}
.actions{display:grid;grid-template-columns:52px 1fr 1.3fr;gap:8px}
.btn{height:52px;font-size:15.5px;font-weight:600;border:1px solid var(--ink);display:grid;place-items:center;background:var(--raised);text-align:center}
.btn.solid{background:var(--ink);color:#fff}
.btn.icon{padding:0}
.btn.icon[aria-pressed=true]{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.assure{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:10;background:var(--bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.tabs .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:88px;max-width:200px;height:48px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;padding:0 10px}
.tabs button[aria-selected=true]{color:var(--text);font-weight:600;border-bottom-color:var(--ink)}
.tabs button .n{font-size:12px;color:var(--muted);margin-left:3px}
.detail{max-width:860px;margin:0 auto;background:var(--surface)}
.detail img{width:100%;height:auto}
.panel{max-width:860px;margin:0 auto;padding:44px max(16px,env(safe-area-inset-right,0px)) 52px max(16px,env(safe-area-inset-left,0px))}
.panel h3{font-size:20px;font-weight:600;margin:8px 0 18px}
.panel table{width:100%;border-collapse:collapse;font-size:14.5px;border-top:1px solid var(--ink)}
.panel th,.panel td{text-align:left;padding:13px 8px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
.panel th{width:120px;color:var(--muted);font-weight:500}
.panel .tbl{overflow-x:auto}
.panel ul{margin:0;padding-left:18px;line-height:1.9}
.note{background:var(--surface);padding:14px 16px;font-size:14px;line-height:1.6;margin-top:16px}
.note b{display:block;font-weight:600;margin-bottom:3px}
.rating{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.rating .big{font-size:34px;font-weight:800}
.rating .stars{color:var(--warning);letter-spacing:2px}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0 6px}
.timeline div{background:var(--surface);padding:12px 10px;font-size:12.5px;line-height:1.45;min-width:0}
.timeline b{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
@media (max-width:640px){.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ticket{border:1px solid var(--line);background:var(--raised);padding:14px 16px;margin-bottom:10px;font-size:14px}
.ticket .st{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);margin-bottom:6px}
.ticket .st.open{border-color:var(--accent);color:var(--accent)}

.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.form input,.form textarea{border:1px solid var(--line-input);background:var(--raised);padding:11px 12px;font-size:15px;width:100%}
.form textarea{min-height:120px;resize:vertical}

/* 모바일 하단 구매바 / 탭바 */
.buybar,.tabbar{display:none}
@media (max-width:860px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
    height:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);position:relative}
  .tabbar a[aria-current=page]{color:var(--text)}
  .tabbar a .count{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  .tabbar a .count[data-zero]{display:none}
  body{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
  .buybar{display:grid;grid-template-columns:52px 1fr 1.3fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .buybar .btn{height:48px}
  body.on-product{padding-bottom:calc(var(--buybar) + env(safe-area-inset-bottom,0px))}
  body.on-product .tabbar{display:none}
  .info .qty-line,.info .total,.info .actions{display:none}   /* 폰에서는 바텀시트가 대신함 */
}

/* 서랍·시트 */
.scrim{position:fixed;inset:0;background:rgba(20,22,24,.42);z-index:40}

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 60px rgba(0,0,0,.12)}

.lines{flex:1;overflow:auto;padding:6px 20px}

.line img{width:72px;height:72px;object-fit:cover;background:var(--surface)}
.line .t{font-size:13.5px;line-height:1.4}
.line .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.line .rm{font-size:12.5px;color:var(--muted);text-decoration:underline}
.line .stepper button{width:30px;height:30px;font-size:15px} .line .stepper output{min-width:30px}
.line .fee{font-size:12px;color:var(--muted);margin-top:4px}
.drawer footer{padding:16px 20px 20px;border-top:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px;gap:8px}
.sum.big{color:var(--text);font-size:18px;font-weight:800;margin:10px 0 14px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(20,22,24,.14);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto}

/* 마이·정책 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}

.tile{background:var(--surface);padding:16px 14px;min-width:0}

<script>
PRODUCTS_PLACEHOLDER
// ---- 설정값 (오픈 전 확정 필요) ---------------------------------------------
const RETURN_FEE = 6000;        // 단순 변심 왕복 반품비(원). 상품별로 다르면 p.return_fee 로 덮어씀
const TOLERANCE = 5;            // 실측 오차 허용 %. 넘으면 반품비 0원
const SHIP_DAYS = [1, 2];       // 출고 영업일
const TRANSIT_DAYS = [1, 2];    // 택배 영업일
const INSPECT_DAYS = 2;         // 반품 입고 후 검수 영업일
const TICKET_SLA_H = 24;        // 문의 답변 약속(시간, 영업일 기준)
const DELAY_POINT = 1000;       // 도착 예정일 지연 시 하루당 자동 적립(원)

const CATS = [...new Set(PRODUCTS.map(p => p.cat))];
const won = n => n.toLocaleString("ko-KR");
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let state = {
  cat: "전체", sort: "pick", q: "",
  cart: load("otori-cart", {}), likes: load("otori-likes", {}), recent: load("otori-recent", []),
  tickets: load("otori-tickets", []), searches: load("otori-searches", []), qty: 1
};
if (typeof state.cart !== "object" || !state.cart) state.cart = {};
if (typeof state.likes !== "object" || !state.likes) state.likes = {};

// ---- 날짜: KST 영업일 ------------------------------------------------------
const DAYS = ["일","월","화","수","목","금","토"];
function kstToday(){ const d = new Date(Date.now() + 9*3600*1000); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
function addBiz(date, n){ const d = new Date(date); let left = n; while (left > 0) { d.setUTCDate(d.getUTCDate() + 1); if (d.getUTCDay() !== 0 && d.getUTCDay() !== 6) left--; } return d; }
const fmtD = d => `${d.getUTCMonth()+1}/${d.getUTCDate()}(${DAYS[d.getUTCDay()]})`;
function arrival(){ const t = kstToday(); return [addBiz(t, SHIP_DAYS[0] + TRANSIT_DAYS[0]), addBiz(t, SHIP_DAYS[1] + TRANSIT_DAYS[1])]; }
const arrivalText = () => { const [a, b] = arrival(); return `${fmtD(a)}~${fmtD(b)} 도착 예정`; };
const fee = p => p.return_fee != null ? p.return_fee : RETURN_FEE;
const priceOf = p => p.price;

// ---- 라우팅 ----------------------------------------------------------------
function route(){
  const h = location.hash.replace("#", "") || "home";
  closeAll();
  document.body.classList.remove("on-product"); $("buybar").hidden = true;
  if (byId[h]) renderProduct(byId[h]);
  else if (h === "likes") renderLikes();
  else if (h === "my") renderMy();
  else if (h === "cats") renderCats();
  else if (h === "search") renderSearch();
  else if (h === "policy") renderPolicy();
  else renderHome();
  document.querySelectorAll(".tabbar a").forEach(a => a.toggleAttribute("aria-current", a.dataset.tab === (byId[h] ? "" : h)) || a.setAttribute("aria-current", a.dataset.tab === h ? "page" : "false"));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ---- 공통 조각 ---------------------------------------------------------------
function heart(p, cls){ const on = !!state.likes[p.id]; return `<button type="button" class="${cls}" data-like="${p.id}" aria-pressed="${on}" aria-label="${on ? "좋아요 취소" : "좋아요"}"><svg class="ico${on ? " on" : ""}" aria-hidden="true"><use href="#i-heart"></use></svg></button>`; }
function card(p, extra){
  return `<a class="card${extra ? " " + extra : ""}" href="#${p.id}">
    <div class="ph">${extra === "rank" ? `<span class="badge num">${p._rank}</span>` : ""}<img src="${p.card}" alt="${esc(p.title)}" loading="lazy" width="720" height="720">${heart(p, "heart")}</div>
    <div class="brand">오토리몰 · ${esc(p.cat)}</div>
    <div class="nm">${esc(p.title)}</div>
    <div class="pr num">${p.compare ? `<span class="off">${Math.round((1 - p.price / p.compare) * 100)}%</span>` : ""}${won(priceOf(p))}원${p.compare ? ` <s>${won(p.compare)}원</s>` : ""}</div>
    <div class="tags"><span>무료배송</span><span>${esc(p.origin)}</span></div>
  </a>`;
}
function renderChips(active){
  const all = ["전체", ...CATS];
  $("catChips").innerHTML = all.map(c => `<a class="chip" href="#home" data-cat="${esc(c)}" aria-pressed="${c === active}">${esc(c)}</a>`).join("");
}
function sortList(list){
  const s = state.sort, l = [...list];
  if (s === "low") l.sort((a, b) => a.price - b.price);
  else if (s === "high") l.sort((a, b) => b.price - a.price);
  else if (s === "new") l.reverse();
  return l;
}
function renderCounts(){
  const c = Object.values(state.cart).reduce((a, b) => a + b, 0), l = Object.keys(state.likes).length;
  $("cartCount").textContent = c; $("cartCount").toggleAttribute("data-zero", !c);
  for (const id of ["likeCount", "likeCountTab"]) { $(id).textContent = l; $(id).toggleAttribute("data-zero", !l); }
}

// ---- 홈 ----------------------------------------------------------------------
function renderHome(){
  renderChips(state.cat);
  const list = sortList(PRODUCTS.filter(p => state.cat === "전체" || p.cat === state.cat));
  const recent = state.recent.map(id => byId[id]).filter(Boolean).slice(0, 10);
  const picks = PRODUCTS.slice(0, 8).map((p, i) => ({ ...p, _rank: i + 1 }));
  $("view").innerHTML = `
    <section class="hero"><div class="wrap">
      <svg class="tori-hero" role="img" aria-label="오토리몰 마스코트, 장모 치와와 토리"><use href="#tori"></use></svg>
      <div><div class="eyebrow">Otori Mall</div><h1>오토리몰</h1><p>토리네 집에서 쓰는 물건</p></div>
      <div class="meta"><span><b>전 상품 무료배송</b></span><span>결제 후 1–2일 출고</span><span>오늘 주문 시 ${arrivalText()}</span></div>
    </div></section>
    <div class="wrap">
      ${recent.length ? `<section class="sec"><div class="sec-head"><h2>최근 본 상품</h2><button type="button" id="clearRecent">지우기</button></div><div class="rail">${recent.map(p => card(p)).join("")}</div></section>` : ""}
      <section class="sec"><div class="sec-head"><h2>오토리 픽</h2><span>오픈 후에는 판매·조회·후기로 집계한 랭킹이 됩니다</span></div><div class="rail">${picks.map(p => card(p, "rank")).join("")}</div></section>
      <div class="toolbar"><h2>${esc(state.cat === "전체" ? "모든 상품" : state.cat)}<span class="cnt num">${list.length}개</span></h2>
        <label class="sort">정렬 <select id="sortSel"><option value="pick"${state.sort==="pick"?" selected":""}>추천순</option><option value="low"${state.sort==="low"?" selected":""}>낮은 가격순</option><option value="high"${state.sort==="high"?" selected":""}>높은 가격순</option><option value="new"${state.sort==="new"?" selected":""}>신상품순</option></select></label></div>
      <div class="grid">${list.map(p => card(p)).join("")}</div>
    </div>`;
  $("sortSel").onchange = e => { state.sort = e.target.value; renderHome(); };
  if ($("clearRecent")) $("clearRecent").onclick = () => { state.recent = []; save("otori-recent", []); renderHome(); };
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  state.cat = b.dataset.cat;
  if (location.hash && location.hash !== "#home") { location.hash = "home"; } else { e.preventDefault(); renderHome(); window.scrollTo(0, 0); }
});

// ---- 카테고리 / 검색 / 좋아요 ------------------------------------------------
function renderCats(){
  renderChips("");
  $("view").innerHTML = `<div class="wrap"><div class="toolbar"><h2>카테고리</h2></div><div class="list">${["전체", ...CATS].map(c => `<a href="#home" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="arrow num">${c === "전체" ? PRODUCTS.length : PRODUCTS.filter(p => p.cat === c).length}개 ›</span></a>`).join("")}</div></div>`;
}
function renderSearch(){
  renderChips("");
  const q = state.q.trim();
  const hits = q ? PRODUCTS.filter(p => (p.title + " " + p.cat).toLowerCase().includes(q.toLowerCase())) : [];
  $("view").innerHTML = `<div class="wrap">
    <form class="form" id="searchForm" style="padding-block:18px 6px"><label><span class="sr">검색어</span><input id="q" type="search" placeholder="상품명이나 카테고리로 찾기" value="${esc(q)}" autocomplete="off"></label></form>
    ${q ? `<div class="toolbar"><h2>'${esc(q)}' 검색 결과<span class="cnt num">${hits.length}개</span></h2></div>
      ${hits.length ? `<div class="grid">${hits.map(p => card(p)).join("")}</div>` : `<div class="empty"><b>찾는 상품이 없어요</b>다른 말로 다시 찾아보거나 카테고리에서 골라보세요.</div>`}`
    : `${state.searches.length ? `<section class="sec"><div class="sec-head"><h2>최근 검색어</h2><button type="button" id="clearSearches">지우기</button></div><div class="subtabs">${state.searches.map(s => `<button class="chip" type="button" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div></section>` : ""}
       <section class="sec"><div class="sec-head"><h2>카테고리로 찾기</h2></div><div class="subtabs">${CATS.map(c => `<a class="chip" href="#home" data-cat="${esc(c)}">${esc(c)}</a>`).join("")}</div></section>`}
  </div>`;
  const input = $("q"); if (!q) input.focus();
  $("searchForm").onsubmit = ev => { ev.preventDefault(); const v = input.value.trim(); state.q = v;
    if (v) { state.searches = [v, ...state.searches.filter(s => s !== v)].slice(0, 8); save("otori-searches", state.searches); } renderSearch(); };
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { state.q = b.dataset.q; renderSearch(); });
  if ($("clearSearches")) $("clearSearches").onclick = () => { state.searches = []; save("otori-searches", []); renderSearch(); };
}
$("openSearch").onclick = () => { state.q = ""; location.hash = location.hash === "#search" ? "#search " : "search"; if (location.hash === "#search") renderSearch(); };
function renderLikes(){
  renderChips("");
  const list = Object.keys(state.likes).map(id => byId[id]).filter(Boolean);
  $("view").innerHTML = `<div class="wrap"><div class="toolbar"><h2>좋아요<span class="cnt num">${list.length}개</span></h2></div>
    ${list.length ? `<div class="grid">${list.map(p => card(p)).join("")}</div>` : `<div class="empty"><b>아직 좋아요한 상품이 없어요</b>마음에 드는 상품의 하트를 누르면 여기에 모입니다. 오픈 후에는 가격이 내리거나 재입고되면 알려드려요.<a class="btn" href="#home">상품 보러 가기</a></div>`}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-like]"); if (!b) return;
  e.preventDefault();
  const id = b.dataset.like, on = !state.likes[id];
  if (on) state.likes[id] = Date.now(); else delete state.likes[id];
  save("otori-likes", state.likes); renderCounts();
  document.querySelectorAll(`[data-like="${id}"]`).forEach(x => { x.setAttribute("aria-pressed", on); x.setAttribute("aria-label", on ? "좋아요 취소" : "좋아요"); x.querySelector(".ico").classList.toggle("on", on); });
  const lc = document.querySelector("[data-likecount]"); if (lc) lc.textContent = on ? 1 : 0;
  toast(on ? "좋아요에 담았습니다" : "좋아요를 취소했습니다");
  if (location.hash === "#likes") renderLikes();
});

// ---- 상품 ----------------------------------------------------------------------
function renderProduct(p){
  renderChips(p.cat);
  document.body.classList.add("on-product"); $("buybar").hidden = false;
  state.qty = 1;
  state.recent = [p.id, ...state.recent.filter(x => x !== p.id)].slice(0, 20); save("otori-recent", state.recent);
  const gallery = [p.card, ...p.sections.filter(s => !/_05_spec|_09_notice/.test(s.src)).map(s => s.src).slice(0, 4)];
  const spec = [["상품명", p.title], ["원산지", p.origin], ...(p.maker ? [["제조사", p.maker]] : []), ...(p.model ? [["모델명", p.model]] : []), ["배송", "무료배송 · 결제 후 1–2일 출고"], ["상품코드", `DM-${p.supplier_no}`]];
  const tickets = state.tickets.filter(t => t.pid === p.id);
  const related = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 6);
  const todayS = fmtD(kstToday());
  $("view").innerHTML = `
    <div class="wrap">
      <nav class="crumb" aria-label="위치"><a href="#home" data-cat="전체">홈</a> › <a href="#home" data-cat="${esc(p.cat)}">${esc(p.cat)}</a></nav>

  $("sMinus").onclick = () => { state.qty = Math.max(1, state.qty - 1); sync(); };
  $("sPlus").onclick = () => { state.qty = Math.min(max, state.qty + 1); sync(); };

function cartTotal(){ return Object.entries(state.cart).reduce((s, [id, q]) => s + (byId[id] ? byId[id].price * q : 0), 0); }
function renderCart(){
  const ids = Object.keys(state.cart).filter(id => byId[id]);

      <div class="row"><button type="button" class="rm" data-rm="${id}">삭제</button><span></span></div></div></div>`; }).join("")

  $("drawerFoot").innerHTML = ids.length ? `
    <div class="sum"><span>상품금액</span><span class="num">${won(tot)}원</span></div>
    <div class="sum"><span>배송비</span><span>무료</span></div>
    <div class="sum"><span>도착 예정</span><span>${arrivalText()}</span></div>
    <div class="sum big"><span>결제 예정금액</span><span class="num">${won(tot)}원</span></div>
    <div id="orderMsg"></div>
    <button class="btn solid" style="width:100%" type="button" id="checkout">주문하기</button>` : "";
  const c = $("checkout");
  if (c) c.onclick = () => { $("orderMsg").innerHTML = `<div class="note"><b>오픈 준비 중입니다</b>사업자 등록과 통신판매업 신고를 마치면 주문을 받을 예정입니다. 지금은 상품 구성과 가격, 배송·반품 약속을 미리 보여드리는 페이지입니다.</div>`; c.hidden = true; };
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-inc],[data-dec],[data-rm]"); if (!t) return;
  const id = t.dataset.inc || t.dataset.dec || t.dataset.rm;
  if (t.dataset.inc) state.cart[id] = Math.min(byId[id].stock, state.cart[id] + 1);
  if (t.dataset.dec) state.cart[id] = Math.max(1, state.cart[id] - 1);
  if (t.dataset.rm) delete state.cart[id];
  save("otori-cart", state.cart); renderCounts(); renderCart();
});

function closeAll(){ $("scrim").hidden = true; $("drawer").hidden = true; $("sheet").hidden = true; }
